<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unicorn Chess</title>
<style>
  :root {
    --bg: #f6f1fb;
    --panel: #ffffff;
    --text: #2d2340;
    --muted: #7a6d91;
    --light-sq: #fbeef6;
    --dark-sq: #b9c8ef;
    --accent: #c25fa0;
    --select: rgba(255, 214, 92, 0.75);
    --last: rgba(255, 230, 140, 0.55);
    --check: radial-gradient(circle, rgba(255, 40, 80, 0.9) 0%, rgba(255, 40, 80, 0.35) 55%, transparent 75%);
    --dot: rgba(70, 50, 110, 0.35);
    --border: #e1d6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1626; --panel: #261f35; --text: #f1eaff; --muted: #a99bc4;
      --light-sq: #d9c9e4; --dark-sq: #6f7fb3; --border: #3a3050; --dot: rgba(30, 20, 50, 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1626; --panel: #261f35; --text: #f1eaff; --muted: #a99bc4;
    --light-sq: #d9c9e4; --dark-sq: #6f7fb3; --border: #3a3050; --dot: rgba(30, 20, 50, 0.45);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  .app { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; max-width: 1040px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: 0.9rem; }
  .board-wrap { width: min(92vw, 600px); }
  .status {
    padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border);
    margin-bottom: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; min-height: 46px;
  }
  .swatch { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,.2); }
  .swatch.w { background: #f4f1ea; } .swatch.b { background: #262626; }
  .board {
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); aspect-ratio: 1; width: 100%;
    border-radius: 10px; overflow: hidden; box-shadow: 0 8px 30px rgba(80, 40, 120, 0.25); touch-action: none; user-select: none;
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sq.light { background: var(--light-sq); } .sq.dark { background: var(--dark-sq); }
  .sq.last::before, .sq.sel::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
  .sq.last::before { background: var(--last); }
  .sq.sel::before { background: var(--select); }
  .sq.check::before { background: var(--check); }
  .sq.target::after {
    content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); pointer-events: none;
  }
  .sq.target.capture::after { width: 88%; height: 88%; background: transparent; border: 5px solid var(--dot); }
  .sq svg { width: 88%; height: 88%; position: relative; z-index: 1; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .coord { position: absolute; font-size: 11px; font-weight: 700; opacity: .65; pointer-events: none; z-index: 2; color: #3d3360; }
  .coord.file { right: 4px; bottom: 2px; } .coord.rank { left: 4px; top: 2px; }
  .side { width: min(92vw, 340px); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select {
    font: inherit; font-size: .9rem; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button:disabled { opacity: .5; cursor: default; }
  label { font-size: .9rem; }
  .captured { min-height: 30px; display: flex; flex-wrap: wrap; gap: 0; align-items: center; }
  .captured svg { width: 26px; height: 26px; margin-right: -6px; }
  .moves { max-height: 260px; overflow-y: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem;
    display: grid; grid-template-columns: 36px 1fr 1fr; row-gap: 2px; }
  .moves .n { color: var(--muted); }
  .moves .cur { background: var(--select); border-radius: 4px; padding: 0 3px; color: #2d2340; }
  .modal { position: fixed; inset: 0; background: rgba(20, 10, 40, .55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.open { display: flex; }
  .modal .box { background: var(--panel); border-radius: 14px; padding: 18px; text-align: center; max-width: 380px; width: 100%; }
  .promo { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .promo button { width: 72px; height: 72px; padding: 4px; }
  .promo svg { width: 100%; height: 100%; }
  .legend { font-size: .85rem; color: var(--muted); line-height: 1.5; }
  .legend .row svg { width: 28px; height: 28px; }
</style>
</head>
<body>
<div class="app">
  <div class="board-wrap">
    <h1>🦄 Unicorn Chess 🗼</h1>
    <p class="sub">White vs Black. Unicorns replace knights and Eiffel Towers replace rooks. Their moves stay the same.</p>
    <div class="status" id="status"></div>
    <div class="board" id="board" aria-label="Chess board"></div>
  </div>

  <div class="side">
    <div class="card">
      <h2>Game</h2>
      <div class="row" style="margin-bottom:8px">
        <label for="mode">Opponent</label>
        <select id="mode">
          <option value="human">Two players</option>
          <option value="ai-b">Computer plays Black</option>
          <option value="ai-w">Computer plays White</option>
        </select>
      </div>
      <div class="row" style="margin-bottom:10px">
        <label for="level">Difficulty</label>
        <select id="level">
          <option value="1">Easy</option>
          <option value="2" selected>Medium</option>
          <option value="3">Hard</option>
        </select>
      </div>
      <div class="row">
        <button class="primary" id="newGame">New game</button>
        <button id="undo">Undo</button>
        <button id="flip">Flip board</button>
      </div>
    </div>

    <div class="card">
      <h2>Captured by White</h2>
      <div class="captured" id="capW"></div>
      <h2 style="margin-top:10px">Captured by Black</h2>
      <div class="captured" id="capB"></div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <div class="moves" id="moves"></div>
    </div>

    <div class="card legend" id="legend"></div>
  </div>
</div>

<div class="modal" id="promoModal">
  <div class="box">
    <strong>Promote your pawn to:</strong>
    <div class="promo" id="promoChoices"></div>
  </div>
</div>

<div class="modal" id="endModal">
  <div class="box">
    <div style="font-size:2.4rem" id="endEmoji">🏆</div>
    <h2 id="endTitle" style="margin:6px 0"></h2>
    <p id="endText" style="color:var(--muted)"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="endNew">Play again</button>
      <button id="endClose">View board</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  const E = window.ChessEngine;

  const PALETTE = {
    w: { fill: '#f4f1ea', light: '#b8b2a6', stroke: '#2a2a2a', name: 'White' },
    b: { fill: '#262626', light: '#8c8c8c', stroke: '#000000', name: 'Black' },
  };
  const PIECE_NAMES = { p: 'Pawn', n: 'Unicorn', b: 'Bishop', r: 'Eiffel Tower', q: 'Queen', k: 'King' };

  // ---- Piece artwork (100x100 viewBox) ----
  function pieceSVG(t, c) {
    const { fill, light, stroke } = PALETTE[c];
    const base = `<rect x="22" y="80" width="56" height="12" rx="4"/>`;
    let body = '';
    switch (t) {
      case 'p':
        body = `<circle cx="50" cy="30" r="13"/>
          <path d="M37 47 Q50 40 63 47 L58 51 Q56 66 66 80 L34 80 Q44 66 42 51 Z"/>${base}`;
        break;
      case 'b':
        body = `<circle cx="50" cy="13" r="6"/>
          <path d="M50 19 Q28 38 36 56 L64 56 Q72 38 50 19 Z"/>
          <path d="M55 29 L45 43" fill="none" stroke-width="4"/>
          <ellipse cx="50" cy="60" rx="18" ry="5"/>
          <path d="M38 64 Q44 72 33 80 L67 80 Q56 72 62 64 Z"/>${base}`;
        break;
      case 'q':
        body = `<path d="M22 32 L34 60 L37 24 L46 56 L50 18 L54 56 L63 24 L66 60 L78 32 L70 68 L30 68 Z"/>
          <circle cx="22" cy="30" r="5"/><circle cx="37" cy="22" r="5"/><circle cx="50" cy="15" r="5"/>
          <circle cx="63" cy="22" r="5"/><circle cx="78" cy="30" r="5"/>
          <path d="M31 68 L69 68 L64 80 L36 80 Z"/>${base}`;
        break;
      case 'k':
        body = `<rect x="46" y="3" width="8" height="22" rx="1"/><rect x="39" y="9" width="22" height="8" rx="1"/>
          <path d="M50 25 Q28 28 31 50 L69 50 Q72 28 50 25 Z"/>
          <ellipse cx="50" cy="54" rx="20" ry="5"/>
          <path d="M34 58 L66 58 Q60 70 67 80 L33 80 Q40 70 34 58 Z"/>${base}`;
        break;
      case 'n': // Unicorn: horse head with a golden spiral horn and a light, curly mane
        body = `
          <path d="M28 80 L74 80 Q76 66 70 54 Q66 42 72 30 Q66 19 54 17 L48 12 L45 21
                   Q30 27 22 44 Q18 52 21 58 Q25 63 32 60 Q38 57 45 55 Q41 67 28 80 Z"/>
          <g fill="${light}" stroke="${stroke}" stroke-width="2">
            <circle cx="58" cy="19" r="6"/><circle cx="67" cy="26" r="6"/><circle cx="71" cy="36" r="6"/>
            <circle cx="70" cy="47" r="6"/><circle cx="73" cy="58" r="6"/><circle cx="75" cy="69" r="6"/>
          </g>
          <path d="M37 25 L46 20 L26 2 Z" fill="#ffd54a" stroke="#a87b00" stroke-width="2" stroke-linejoin="round"/>
          <path d="M31 8 L36 7 M34 12 L40 11 M38 16 L43 16" stroke="#a87b00" stroke-width="2" fill="none"/>
          <circle cx="41" cy="35" r="3.5" fill="${stroke}" stroke="none"/>
          <circle cx="42" cy="34" r="1.2" fill="#fff" stroke="none"/>
          <circle cx="26" cy="52" r="2" fill="${stroke}" stroke="none"/>
          ${base}`;
        break;
      case 'r': // Eiffel Tower
        body = `
          <path d="M50 3 L52 16 L55 16 L57 33 L61 33 L61 37 L58 37 L63 55 L68 55 L68 59 L65 59
                   L77 86 L61 86 Q50 66 39 86 L23 86 L35 59 L32 59 L32 55 L37 55 L42 37 L39 37 L39 33
                   L43 33 L45 16 L48 16 Z"/>
          <g fill="none" stroke="${light}" stroke-width="1.6">
            <path d="M46 18 L54 31 M54 18 L46 31"/>
            <path d="M44 38 L57 53 M56 38 L43 53"/>
            <path d="M37 61 L50 72 M63 61 L50 72 M33 70 L41 80 M67 70 L59 80"/>
          </g>
          <rect x="38" y="32" width="24" height="5" rx="1"/>
          <rect x="31" y="54" width="38" height="5" rx="1"/>
          <rect x="20" y="86" width="60" height="7" rx="3"/>`;
        break;
    }
    return `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${fill}" stroke="${stroke}"
      stroke-width="3" stroke-linejoin="round">${body}</g></svg>`;
  }

  // ---- State ----
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const modeEl = document.getElementById('mode');
  const levelEl = document.getElementById('level');
  let game, history, sans, selected, flipped = false, thinking = false, endShown = false, pendingPromo = null;
  let aiTimer = null;

  function newGame() {
    clearTimeout(aiTimer);
    thinking = false;
    game = E.newGame();
    history = [];
    sans = [];
    selected = null;
    endShown = false;
    closeModal('endModal');
    closeModal('promoModal');
    flipped = modeEl.value === 'ai-w';
    render();
    maybeAI();
  }

  const aiColor = () => (modeEl.value === 'ai-b' ? 'b' : modeEl.value === 'ai-w' ? 'w' : null);
  const humanTurn = () => !thinking && game.turn !== aiColor() && !E.status(game).over;

  function doMove(m) {
    sans.push(E.san(game, m));
    history.push(game);
    game = E.makeMove(game, m);
    selected = null;
    render();
    maybeAI();
  }

  function maybeAI() {
    if (game.turn !== aiColor() || E.status(game).over) return;
    thinking = true;
    render();
    aiTimer = setTimeout(() => {
      const m = E.bestMove(game, +levelEl.value);
      thinking = false;
      if (m) doMove(m);
    }, 350);
  }

  function undo() {
    clearTimeout(aiTimer);
    thinking = false;
    if (!history.length) return;
    // Against the computer, step back to the human's previous turn.
    do {
      game = history.pop();
      sans.pop();
    } while (history.length && game.turn === aiColor());
    selected = null;
    endShown = false;
    render();
    maybeAI();
  }

  // ---- Input: tap a piece then a square, or drag a piece onto a square ----
  function legalTo(from, to) {
    return E.legalMoves(game).filter((m) => m.from === from && m.to === to);
  }
  function play(options) {
    if (options.length > 1) openPromo(options);
    else doMove(options[0]);
  }

  let dragFrom = null, deselectOnUp = false;
  boardEl.addEventListener('pointerdown', (e) => {
    const sqEl = e.target.closest('.sq');
    if (!sqEl || !humanTurn()) return;
    const i = +sqEl.dataset.i;
    const p = game.board[i];
    dragFrom = null;
    if (selected !== null && legalTo(selected, i).length) {
      play(legalTo(selected, i));
    } else if (p && p.c === game.turn) {
      deselectOnUp = selected === i;
      selected = i;
      dragFrom = i;
      render();
    } else {
      selected = null;
      render();
    }
  });
  boardEl.addEventListener('pointerup', (e) => {
    if (dragFrom === null) return;
    const from = dragFrom;
    dragFrom = null;
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const sqEl = el && el.closest('.sq');
    if (!sqEl) return;
    const i = +sqEl.dataset.i;
    if (i === from) {
      if (deselectOnUp) { selected = null; render(); }
    } else if (legalTo(from, i).length) {
      play(legalTo(from, i));
    }
  });

  // ---- Promotion ----
  function openPromo(options) {
    pendingPromo = options;
    const box = document.getElementById('promoChoices');
    box.innerHTML = '';
    for (const t of ['q', 'r', 'b', 'n']) {
      const b = document.createElement('button');
      b.title = PIECE_NAMES[t];
      b.innerHTML = pieceSVG(t, game.turn);
      b.onclick = () => {
        closeModal('promoModal');
        const m = pendingPromo.find((o) => o.promo === t);
        pendingPromo = null;
        doMove(m);
      };
      box.appendChild(b);
    }
    document.getElementById('promoModal').classList.add('open');
  }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }

  // ---- Rendering ----
  function render() {
    const st = E.status(game);
    const legal = selected !== null ? E.legalMoves(game).filter((m) => m.from === selected) : [];
    const last = game.lastMove;
    let kingInCheck = -1;
    if (st.check) kingInCheck = game.board.findIndex((p) => p && p.t === 'k' && p.c === game.turn);

    boardEl.innerHTML = '';
    for (let v = 0; v < 64; v++) {
      const i = flipped ? 63 - v : v;
      const r = Math.floor(i / 8), c = i % 8;
      const d = document.createElement('div');
      d.className = 'sq ' + ((r + c) % 2 ? 'dark' : 'light');
      d.dataset.i = i;
      if (last && (last.from === i || last.to === i)) d.classList.add('last');
      if (selected === i) d.classList.add('sel');
      if (kingInCheck === i) d.classList.add('check');
      const target = legal.find((m) => m.to === i);
      if (target) d.classList.add('target', game.board[i] || target.enPassant ? 'capture' : 'quiet');
      const p = game.board[i];
      if (p) {
        d.innerHTML = pieceSVG(p.t, p.c);
        d.setAttribute('aria-label', `${PALETTE[p.c].name} ${PIECE_NAMES[p.t]} on ${E.squareName(i)}`);
      }
      if (v % 8 === 0) d.insertAdjacentHTML('beforeend', `<span class="coord rank">${8 - r}</span>`);
      if (v >= 56) d.insertAdjacentHTML('beforeend', `<span class="coord file">${'abcdefgh'[c]}</span>`);
      boardEl.appendChild(d);
    }

    // Status line
    const who = PALETTE[game.turn].name;
    let msg;
    if (st.over) {
      msg = st.result === 'checkmate' ? `Checkmate! ${PALETTE[st.winner].name} wins 🎉` : `Draw: ${drawReason(st.result)}`;
    } else if (thinking) msg = `${who} (computer) is thinking…`;
    else msg = `${who} to move${st.check ? ', check!' : ''}`;
    statusEl.innerHTML = `<span class="swatch ${st.over && st.winner ? st.winner : game.turn}"></span>${msg}`;

    // Captured pieces
    const caps = { w: [], b: [] };
    // Each state records what the move into it captured; history[k].turn made that move.
    for (let k = 0; k < history.length; k++) {
      const next = history[k + 1] || game;
      if (next.captured) caps[history[k].turn].push(next.captured);
    }
    const order = 'qrbnp';
    for (const c of ['w', 'b']) {
      caps[c].sort((a, b) => order.indexOf(a.t) - order.indexOf(b.t));
      document.getElementById(c === 'w' ? 'capW' : 'capB').innerHTML = caps[c].map((p) => pieceSVG(p.t, p.c)).join('');
    }

    // Move list
    const mv = document.getElementById('moves');
    let html = '';
    for (let k = 0; k < sans.length; k += 2) {
      html += `<span class="n">${k / 2 + 1}.</span><span${k === sans.length - 1 ? ' class="cur"' : ''}>${sans[k]}</span>` +
        `<span${k + 1 === sans.length - 1 ? ' class="cur"' : ''}>${sans[k + 1] || ''}</span>`;
    }
    mv.innerHTML = html;
    mv.scrollTop = mv.scrollHeight;

    document.getElementById('undo').disabled = !history.length;

    if (st.over && !endShown) {
      endShown = true;
      setTimeout(() => showEnd(st), 400);
    }
  }

  function drawReason(r) {
    return { stalemate: 'stalemate', fifty: '50-move rule', repetition: 'threefold repetition', material: 'insufficient material' }[r];
  }

  function showEnd(st) {
    document.getElementById('endEmoji').textContent = st.result === 'checkmate' ? (st.winner === 'w' ? '🤍🏆' : '🖤🏆') : '🤝';
    document.getElementById('endTitle').textContent = st.result === 'checkmate' ? `${PALETTE[st.winner].name} wins!` : 'Draw';
    document.getElementById('endText').textContent = st.result === 'checkmate' ? 'Checkmate.' : `By ${drawReason(st.result)}.`;
    document.getElementById('endModal').classList.add('open');
  }

  // Legend
  document.getElementById('legend').innerHTML = '<h2>Pieces</h2>' + ['k', 'q', 'r', 'b', 'n', 'p'].map((t) =>
    `<div class="row">${pieceSVG(t, 'w')}${pieceSVG(t, 'b')}<span>${PIECE_NAMES[t]}${t === 'r' ? ' (moves like a rook)' : t === 'n' ? ' (moves like a knight)' : ''}</span></div>`
  ).join('');

  document.getElementById('newGame').onclick = newGame;
  document.getElementById('endNew').onclick = newGame;
  document.getElementById('endClose').onclick = () => closeModal('endModal');
  document.getElementById('undo').onclick = undo;
  document.getElementById('flip').onclick = () => { flipped = !flipped; render(); };
  modeEl.onchange = newGame;

  newGame();
})();
</script>
</body>
</html>
