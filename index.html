<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone Chess</title>
<style>
  :root {
    --bg: #ebe8e3;
    --panel: #ffffff;
    --panel-2: #f4f2ee;
    --text: #262421;
    --muted: #6f6a62;
    --border: #dcd7cf;
    --accent: #81b64c;
    --accent-ink: #ffffff;
    --frame: #1b1b1b;
    --coord-light: #7fa65a;
    --coord-dark: #ece8de;
    --select: rgba(129, 182, 76, 0.55);
    --last: rgba(246, 226, 110, 0.38);
    --dot: rgba(0, 0, 0, 0.32);
    --danger: #c9473b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #262421; --panel: #312e2b; --panel-2: #3a3733; --text: #f0ede8; --muted: #a8a29a; --border: #45413c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #262421; --panel: #312e2b; --panel-2: #3a3733; --text: #f0ede8; --muted: #a8a29a; --border: #45413c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center; padding: 16px;
  }
  .app { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; max-width: 1080px; width: 100%; }
  h1 { margin: 0 0 4px; font-size: 1.45rem; }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
  .main { width: min(100%, 640px); }
  .status {
    padding: 10px 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border);
    margin-bottom: 10px; font-weight: 600; display: flex; align-items: center; gap: 10px; min-height: 46px;
  }
  .swatch { width: 16px; height: 16px; border-radius: 50%; flex: none; border: 2px solid #555; }
  .swatch.w { background: #f4f4f4; } .swatch.b { background: #1a1a1a; }
  .board-row { display: flex; gap: 8px; align-items: stretch; }

  /* Eval bar */
  .evalbar { width: 26px; flex: none; position: relative; border-radius: 4px; overflow: hidden; background: #403d39; display: none; }
  .review-on .evalbar { display: block; }
  .evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: #f2f2f2; transition: height .35s ease; }
  .evalbar.flipped .fill { top: 0; bottom: auto; }
  .evalbar .num { position: absolute; left: 0; right: 0; text-align: center; font-size: 10px; font-weight: 700; z-index: 1; }
  .evalbar .num.bottom { bottom: 4px; color: #333; } .evalbar .num.top { top: 4px; color: #eee; }

  /* Board: stone squares separated by dark seams */
  .board {
    position: relative; flex: 1; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 3px; padding: 3px; aspect-ratio: 1; background: var(--frame); border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35); touch-action: none; user-select: none; min-width: 0;
  }
  .sq { position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; background-size: 260px 260px; }
  .sq.light { background-color: #d5d2cb; background-image: var(--stone-light); }
  .sq.dark { background-color: #3b3b3b; background-image: var(--stone-dark); }
  .sq.last::before, .sq.sel::before, .sq.check::before { content: ""; position: absolute; inset: 0; }
  .sq.last::before { background: var(--last); }
  .sq.sel::before { background: var(--select); }
  .sq.check::before { background: radial-gradient(circle, rgba(230, 30, 30, .9) 0%, rgba(230, 30, 30, .4) 55%, transparent 75%); }
  .sq.target::after { content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%; background: var(--dot); pointer-events: none; }
  .sq.target.capture::after { width: 86%; height: 86%; background: transparent; border: 5px solid var(--dot); }
  .sq > svg.piece { width: 90%; height: 90%; position: relative; z-index: 1; pointer-events: none; filter: drop-shadow(1px 3px 2px rgba(0, 0, 0, .35)); }
  .coord { position: absolute; font-weight: 800; pointer-events: none; z-index: 2; font-size: clamp(10px, 2.3vw, 17px); line-height: 1; }
  .coord.rank { left: 5%; top: 5%; } .coord.file { right: 5%; bottom: 4%; }
  .sq.light .coord { color: var(--coord-light); } .sq.dark .coord { color: var(--coord-dark); }
  .badge { position: absolute; top: 2%; right: 2%; width: 36%; height: 36%; z-index: 4; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  .arrows { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); pointer-events: none; z-index: 3; }
  .board, .board * { -webkit-user-drag: none; -webkit-touch-callout: none; }
  .sq.marked::before { content: ""; position: absolute; inset: 0; background: rgba(235, 97, 80, .8); }
  .sq.drag-src > svg.piece { opacity: .3; }
  .sq.drag-over { box-shadow: inset 0 0 0 4px rgba(255, 255, 255, .65); }
  .drag-ghost { position: fixed; left: 0; top: 0; z-index: 50; pointer-events: none; will-change: transform; filter: drop-shadow(2px 6px 4px rgba(0, 0, 0, .45)); }
  .drag-ghost > svg { width: 100%; height: 100%; display: block; }

  /* Side panel */
  .side { width: min(100%, 360px); display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .field { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
  button, select {
    font: inherit; font-size: .9rem; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); cursor: pointer;
  }
  select { width: 100%; min-width: 0; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
  button.danger { color: var(--danger); }
  button.danger.armed { background: var(--danger); color: #fff; border-color: transparent; }
  button:disabled { opacity: .45; cursor: default; }
  label { font-size: .9rem; }
  .captured { min-height: 28px; display: flex; flex-wrap: wrap; align-items: center; }
  .captured svg { width: 26px; height: 26px; margin-right: -6px; }
  .captured .lead { margin-left: 12px; font-size: .9rem; font-weight: 600; color: var(--muted); }
  .moves { max-height: 300px; overflow-y: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem;
    display: grid; grid-template-columns: 34px 1fr 1fr; row-gap: 2px; }
  .moves .n { color: var(--muted); padding-top: 2px; }
  .mv { display: inline-flex; align-items: center; gap: 4px; padding: 1px 4px; border-radius: 4px; }
  .review-on .mv { cursor: pointer; }
  .mv.cur { background: var(--select); }
  .mv svg { width: 16px; height: 16px; flex: none; }
  .var { grid-column: 1 / -1; margin: 2px 0 4px 18px; padding: 4px 6px; border-left: 3px solid var(--accent); background: var(--panel-2);
    border-radius: 0 6px 6px 0; font-size: .85rem; line-height: 1.7; }
  .var .vn { color: var(--muted); margin-left: 2px; }
  .vdel { padding: 0 6px; margin-left: 4px; font-size: .8rem; line-height: 1.4; background: transparent; }
  .tag { display: inline-block; font-size: .7rem; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: #fff; vertical-align: 1px; }
  .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal.open { display: flex; }
  .modal .box { background: var(--panel); border-radius: 14px; padding: 18px; text-align: center; max-width: 380px; width: 100%; }
  .promo { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .promo button { width: 72px; height: 72px; padding: 4px; background: #d5d2cb; }
  .promo svg { width: 100%; height: 100%; }

  /* Review */
  .review-card { display: none; }
  .review-on .review-card { display: block; }
  .progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin: 6px 0 10px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
  .acc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .acc div { background: var(--panel-2); border-radius: 8px; padding: 8px; text-align: center; }
  .acc b { display: block; font-size: 1.4rem; }
  .acc span { font-size: .8rem; color: var(--muted); }
  .comment { display: flex; gap: 10px; align-items: flex-start; background: var(--panel-2); border-radius: 8px; padding: 10px; min-height: 58px; margin-bottom: 10px; font-size: .92rem; }
  .comment svg { width: 30px; height: 30px; flex: none; }
  .comment .ev { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .graph { width: 100%; height: 64px; display: block; border-radius: 6px; cursor: pointer; margin-bottom: 10px; }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
  .counts { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; font-size: .88rem; align-items: center; }
  .counts .lbl { display: flex; align-items: center; gap: 6px; }
  .counts svg { width: 18px; height: 18px; }
  .counts .h { color: var(--muted); font-size: .75rem; text-align: center; }
  .counts .v { text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gw" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#eeeeee"/><stop offset="1" stop-color="#a4a4a4"/>
    </linearGradient>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#777777"/><stop offset="0.32" stop-color="#2f2f2f"/><stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
  </defs>
</svg>

<div class="app" id="app">
  <div class="main">
    <h1>Stone Chess</h1>
    <p class="sub">Play a friend or a computer opponent rated 1000 to 2400, then review your game with Stockfish. Everything runs on your device.</p>
    <div class="status" id="status"></div>
    <div class="board-row">
      <div class="evalbar" id="evalbar"><div class="fill" id="evalfill"></div><span class="num" id="evalnum"></span></div>
      <div class="board" id="board" aria-label="Chess board"></div>
    </div>
  </div>

  <div class="side">
    <div class="card review-card">
      <h2>Game review</h2>
      <div id="reviewProgressText" style="font-size:.85rem;color:var(--muted)"></div>
      <div id="engineLabel" style="font-size:.78rem;color:var(--muted);margin-top:2px"></div>
      <div class="progress"><div id="reviewProgress"></div></div>
      <div class="acc">
        <div><b id="accW">–</b><span>White accuracy</span></div>
        <div><b id="accB">–</b><span>Black accuracy</span></div>
        <div><b id="eloW">–</b><span>White played like</span></div>
        <div><b id="eloB">–</b><span>Black played like</span></div>
      </div>
      <div class="comment" id="comment"></div>
      <svg class="graph" id="graph" viewBox="0 0 300 64" preserveAspectRatio="none"></svg>
      <div class="nav">
        <button id="navFirst" title="Start">⏮</button><button id="navPrev" title="Previous (←)">◀</button>
        <button id="navNext" title="Next (→)">▶</button><button id="navLast" title="End">⏭</button>
      </div>
      <div class="counts" id="counts"></div>
      <div class="row" style="margin-top:12px">
        <button id="deepReview" title="Re-analyze with the full Stockfish 19 at 1.5 s per position. Downloads about 99 MB the first time.">Deep review</button>
        <button id="exitReview">Exit review</button>
      </div>
    </div>

    <div class="card">
      <h2>Game</h2>
      <div class="field"><label for="mode">Opponent</label>
        <select id="mode">
          <option value="ai-b">Computer (you play White)</option>
          <option value="ai-w">Computer (you play Black)</option>
          <option value="human">Two players</option>
        </select>
      </div>
      <div class="field"><label for="level">Bot rating</label><select id="level"></select></div>
      <div class="field"><label for="pieceSet">Pieces</label>
        <select id="pieceSet">
          <option value="classic">Classic</option>
          <option value="unicorn">Unicorns &amp; Eiffel Towers</option>
        </select>
      </div>
      <div class="row">
        <button class="primary" id="newGame" title="Start a new game">↻ New game</button>
        <button class="danger" id="resign">Resign</button>
        <button id="undo">Undo</button>
        <button id="flip">Flip</button>
        <button id="reviewBtn">Review game</button>
      </div>
    </div>

    <div class="card">
      <h2>Captured by White</h2>
      <div class="captured" id="capW"></div>
      <h2 style="margin-top:10px">Captured by Black</h2>
      <div class="captured" id="capB"></div>
    </div>

    <div class="card">
      <h2>Moves</h2>
      <div class="moves" id="moves"></div>
    </div>
  </div>
</div>

<div class="modal" id="promoModal">
  <div class="box">
    <strong>Promote your pawn to:</strong>
    <div class="promo" id="promoChoices"></div>
  </div>
</div>

<div class="modal" id="endModal">
  <div class="box">
    <div style="font-size:2.4rem" id="endEmoji">🏆</div>
    <h2 id="endTitle" style="margin:6px 0"></h2>
    <p id="endText" style="color:var(--muted)"></p>
    <div class="row" style="justify-content:center">
      <button class="primary" id="endReview">Review game</button>
      <button id="endNew">New game</button>
      <button id="endClose">View board</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="ai.js"></script>
<script src="review-stats.js"></script>
<script>
(function () {
  'use strict';
  const E = window.ChessEngine;
  const AI = window.ChessAI;
  const NAMES = { w: 'White', b: 'Black' };
  const other = (c) => (c === 'w' ? 'b' : 'w');
  const LEVEL_NAMES = { 1000: 'Beginner', 1200: 'Novice', 1400: 'Casual', 1600: 'Intermediate', 1800: 'Club player', 2000: 'Advanced', 2200: 'Expert', 2400: 'Master' };

  // ---- Stone textures (procedural SVG noise) ----
  function stone(base, ink, big, fine, seed, freq) {
    const m = (a, b) => `0 0 0 0 ${ink[0]} 0 0 0 0 ${ink[1]} 0 0 0 0 ${ink[2]} ${a} 0 0 0 ${b}`;
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'>
      <filter id='a'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='5' seed='${seed}'/><feColorMatrix values='${m(big, -big * 0.5)}'/></filter>
      <filter id='b'><feTurbulence type='fractalNoise' baseFrequency='0.75 0.35' numOctaves='3' seed='${seed + 7}'/><feColorMatrix values='${m(fine, -fine * 0.52)}'/></filter>
      <rect width='100%' height='100%' fill='${base}'/>
      <rect width='100%' height='100%' filter='url(#a)'/><rect width='100%' height='100%' filter='url(#b)'/></svg>`;
    return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
  }
  document.documentElement.style.setProperty('--stone-light', stone('#d4d1ca', [0.45, 0.44, 0.42], 1.4, 2.8, 4, '0.015 0.045'));
  document.documentElement.style.setProperty('--stone-dark', stone('#383838', [0.6, 0.6, 0.58], 0.9, 2.0, 11, '0.03 0.06'));

  // ---- Piece artwork (100x100 viewBox) ----
  function classicBody(t, D) {
    switch (t) {
      case 'p': return `<circle cx="50" cy="25" r="11"/><ellipse cx="50" cy="40" rx="15" ry="4.5"/>
        <path d="M42 44 Q42 62 30 76 L70 76 Q58 62 58 44 Z"/><rect x="22" y="76" width="56" height="12" rx="4"/>`;
      case 'b': return `<circle cx="50" cy="11" r="6"/>
        <path d="M50 17 C35 27 29 41 34 53 Q50 58 66 53 C71 41 65 27 50 17 Z"/>
        <path d="M50 27 V43 M43 34 H57" stroke="${D}" stroke-width="3" fill="none"/>
        <rect x="36" y="53" width="28" height="7" rx="3"/>
        <path d="M42 60 Q45 68 41 75 L59 75 Q55 68 58 60 Z"/>
        <path d="M50 75 C44 72 36 82 22 82 Q15 85 22 89 L46 89 Q50 85 54 89 L78 89 Q85 85 78 82 C64 82 56 72 50 75 Z"/>`;
      case 'q': return `<path d="M20 34 Q27 50 31 63 L38 23 Q44 34 50 40 Q56 34 62 23 L69 63 Q73 50 80 34 L73 68 L27 68 Z"/>
        <circle cx="20" cy="31" r="5"/><circle cx="38" cy="19" r="5"/><circle cx="62" cy="19" r="5"/><circle cx="80" cy="31" r="5"/>
        <rect x="26" y="65" width="48" height="11" rx="3"/>
        <path d="M50 67 L55 70.5 L50 74 L45 70.5 Z" stroke="${D}" stroke-width="2" fill="none"/>
        <path d="M36 70.5 h.1 M64 70.5 h.1" stroke="${D}" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M24 89 L28 76 L72 76 L76 89 Z"/>`;
      case 'k': return `<path d="M47 4 H53 V10 H59 V16 H53 V24 H47 V16 H41 V10 H47 Z"/>
        <path d="M50 34 C45 21 23 21 23 40 C23 50 29 56 31 62 L69 62 C71 56 77 50 77 40 C77 21 55 21 50 34 Z"/>
        <path d="M50 34 V61" stroke="${D}" stroke-width="2" fill="none"/>
        <rect x="27" y="61" width="46" height="11" rx="3"/>
        <path d="M50 63 L55 66.5 L50 70 L45 66.5 Z" stroke="${D}" stroke-width="2" fill="none"/>
        <path d="M36 66.5 h.1 M64 66.5 h.1" stroke="${D}" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M24 89 L28 72 L72 72 L76 89 Z"/>`;
      case 'r': return `<path d="M26 12 H36 V20 H45 V12 H55 V20 H64 V12 H74 V30 L67 36 V73 L73 78 H27 L33 73 V36 L26 30 Z"/>
        <path d="M26 30 H74 M33 36 H67 M33 47 H67 M33 58 H67 M33 69 H67 M44 36 V47 M56 36 V47 M38 47 V58 M50 47 V58 M62 47 V58 M44 58 V69 M56 58 V69"
          stroke="${D}" stroke-width="1.8" fill="none"/>
        <rect x="21" y="78" width="58" height="11" rx="3"/>`;
      case 'n': return `<path d="M73 89 H26 Q26 72 38 62 Q45 56 46 50 Q40 53 34 57 Q29 62 22 60 Q14 57 17 50 Q20 44 27 38 Q35 30 41 23 L39 11 L48 19 Q57 13 65 17 Q81 26 81 50 Q81 70 73 89 Z"/>
        <path d="M64 20 Q77 30 76 52 Q74 70 67 88" stroke="${D}" stroke-width="2" fill="none"/>
        <path d="M37 34 Q43 29 49 33 Q43 37 37 34 Z" fill="${D}" stroke="none"/>
        <circle cx="22" cy="51" r="2.2" fill="${D}" stroke="none"/>
        <path d="M17 55 Q24 57 31 53" stroke="${D}" stroke-width="2" fill="none"/>`;
    }
  }
  function unicornBody(t, D, light) {
    if (t === 'n') return `<path d="M28 80 L74 80 Q76 66 70 54 Q66 42 72 30 Q66 19 54 17 L48 12 L45 21
        Q30 27 22 44 Q18 52 21 58 Q25 63 32 60 Q38 57 45 55 Q41 67 28 80 Z"/>
      <g fill="${light}" stroke="#141414" stroke-width="2">
        <circle cx="58" cy="19" r="6"/><circle cx="67" cy="26" r="6"/><circle cx="71" cy="36" r="6"/>
        <circle cx="70" cy="47" r="6"/><circle cx="73" cy="58" r="6"/><circle cx="75" cy="69" r="6"/></g>
      <path d="M37 25 L46 20 L26 2 Z" fill="#e9c75a" stroke="#141414" stroke-width="2" stroke-linejoin="round"/>
      <path d="M31 8 L36 7 M34 12 L40 11 M38 16 L43 16" stroke="#8a6d10" stroke-width="2" fill="none"/>
      <circle cx="41" cy="35" r="3.5" fill="${D}" stroke="none"/><circle cx="26" cy="52" r="2" fill="${D}" stroke="none"/>
      <rect x="22" y="80" width="56" height="10" rx="4"/>`;
    return `<path d="M50 3 L52 16 L55 16 L57 33 L61 33 L61 37 L58 37 L63 55 L68 55 L68 59 L65 59
        L77 86 L61 86 Q50 66 39 86 L23 86 L35 59 L32 59 L32 55 L37 55 L42 37 L39 37 L39 33 L43 33 L45 16 L48 16 Z"/>
      <g fill="none" stroke="${D}" stroke-width="1.4">
        <path d="M46 18 L54 31 M54 18 L46 31"/><path d="M44 38 L57 53 M56 38 L43 53"/>
        <path d="M37 61 L50 72 M63 61 L50 72 M33 70 L41 80 M67 70 L59 80"/></g>
      <rect x="38" y="32" width="24" height="5" rx="1"/><rect x="31" y="54" width="38" height="5" rx="1"/>
      <rect x="20" y="86" width="60" height="7" rx="3"/>`;
  }
  let pieceSet = 'classic';
  const pieceName = (t) => ({ p: 'Pawn', n: pieceSet === 'unicorn' ? 'Unicorn' : 'Knight', b: 'Bishop',
    r: pieceSet === 'unicorn' ? 'Eiffel Tower' : 'Rook', q: 'Queen', k: 'King' })[t];
  function pieceSVG(t, c, cls = 'piece') {
    const D = c === 'w' ? '#141414' : '#b9b9b9';
    const body = pieceSet === 'unicorn' && (t === 'n' || t === 'r') ? unicornBody(t, D, c === 'w' ? '#c8c8c8' : '#6e6e6e') : classicBody(t, D);
    return `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><g fill="url(#g${c})" stroke="#141414"
      stroke-width="3" stroke-linejoin="round">${body}</g></svg>`;
  }

  // ---- Move classifications (review) ----
  const CLS = {
    brilliant: { label: 'Brilliant', color: '#26c2a3', text: '!!' },
    great: { label: 'Great', color: '#749bbf', text: '!' },
    best: { label: 'Best', color: '#81b64c', icon: '<path d="M10 3.2l2 4.3 4.6.5-3.4 3.1 1 4.6L10 13.4l-4.2 2.3 1-4.6L3.4 8l4.6-.5z" fill="#fff"/>' },

  // ---- Engines ----
  // Everything runs locally. The built-in engine (ai.js) and Stockfish both run in Web Workers

  const MATE = AI.MATE;

  class BuiltinEngine {
    constructor() { this.seq = 0; this.pending = new Map(); this.broken = false; this.start(); }
    start() {
      this.w = null;
      if (this.broken) return;
      try {
        const src = `(${window.chessAIModule.toString()})(self);`;
        this.w = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      } catch (e) { this.broken = true; return; }
      this.w.onmessage = (e) => { const p = this.pending.get(e.data.id); this.pending.delete(e.data.id); if (p) p.resolve(e.data.result); };
      this.w.onerror = (ev) => {
        if (ev.preventDefault) ev.preventDefault();

    }
    local(opts) { return new Promise((res) => setTimeout(() => res(AI.think(opts)), 20)); }
    think(opts) {

  // Full Stockfish 19 for deep review: ~99 MB, too big to ship in the repo, so it is downloaded on
  // demand. A copy in stockfish/ (from `node stockfish/get-full-engine.js`) is used first when the
  // page is served over HTTP; otherwise it comes from the npm CDN once and is kept in IndexedDB,
  // so later deep reviews work offline.
  const FULL_SF = 'stockfish-19-single';
  const FULL_SF_CDN = 'https://unpkg.com/stockfish@19.0.0/bin/';
  function idb(mode, fn) {
    return new Promise((resolve, reject) => {
      const open = indexedDB.open('stone-chess', 1);
      open.onupgradeneeded = () => open.result.createObjectStore('files');
      open.onerror = () => reject(open.error);
      open.onsuccess = () => {
        const db = open.result, tx = db.transaction('files', mode), req = fn(tx.objectStore('files'));
        tx.oncomplete = () => { db.close(); resolve(req.result); };
        tx.onerror = tx.onabort = () => { db.close(); reject(tx.error); };
      };
    });

  async function fetchOk(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
    return res;
  }

  class StockfishEngine {

    }
    load() {
      if (!this.ready) {
        this.ready = this.sources().reduce((p, src) => p.catch(() => this.boot(src)), Promise.reject())
          .then(() => true, () => { this.ready = null; return false; });

        // fetch shim hands them to the script (from file:// a worker can't fetch blob URLs).
        let files = null;
        try { files = await idb('readonly', (st) => st.get(src.cache)); } catch (e) { /* no storage: download */ }
        if (!files) {
          files = { js: await (await fetchOk(src.js)).text(), wasm: await this.download(src.wasm) };
          try {
            await idb('readwrite', (st) => st.put(files, src.cache));
            if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
          } catch (e) { /* not cached: downloads again next time */ }

          'if(e.data&&e.data.sfWasm){self.removeEventListener("message",h);r(e.data.sfWasm)}})});' +
          'var __sfFetch=self.fetch;self.fetch=function(u,o){return /\\.wasm/.test(String(u))?__sfWasm.then(function(b){' +
          'return new Response(b,{headers:{"Content-Type":"application/wasm"}})}):__sfFetch(u,o)};\n';
        w = new Worker(URL.createObjectURL(new Blob([shim + files.js], { type: 'text/javascript' })) + '#stockfish.wasm');

        w.postMessage({ progressPort: ch.port2, sfWasm: buf }, [ch.port2, buf]);
      } else if (src.js) {

        // Its WASM URL goes after the '#'; the script fetches it itself and reports download progress.
        const js = new URL(src.js, location.href).href, wasm = new URL(src.wasm, location.href).href;
        if (src.probe && !(await fetch(wasm, { method: 'HEAD' })).ok) throw new Error('not found: ' + wasm);
        const res = await fetchOk(js);
        w = new Worker(URL.createObjectURL(new Blob([await res.text()], { type: 'text/javascript' })) + '#' + encodeURIComponent(wasm));
        const ch = new MessageChannel();
        ch.port1.onmessage = (e) => { this.progress = e.data; if (this.onProgress) this.onProgress(e.data); };
        w.postMessage({ progressPort: ch.port2 }, [ch.port2]);
      } else {
        if (!window.STOCKFISH_BUNDLE) await loadScript('stockfish/stockfish-bundle.js');
        const b = window.STOCKFISH_BUNDLE;
        // Hand the worker its WASM from memory: from file:// it may not fetch anything.
        const shim = 'var __sfWasm=Uint8Array.from(atob("' + b.wasm + '"),function(c){return c.charCodeAt(0)});' +
          'var __sfFetch=self.fetch;self.fetch=function(u,o){return /\\.wasm/.test(String(u))?' +
          'Promise.resolve(new Response(__sfWasm,{headers:{"Content-Type":"application/wasm"}})):__sfFetch(u,o)};\n';
        w = new Worker(URL.createObjectURL(new Blob([shim + b.js], { type: 'text/javascript' })) + '#stockfish.wasm');
      }

        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('Stockfish did not start')), this.timeoutMs);
          w.onerror = (e) => { if (e.preventDefault) e.preventDefault(); clearTimeout(timer); reject(e); };
          w.onmessage = (e) => {
            if (String(e.data) !== 'uciok') return;
            clearTimeout(timer);
            w.onmessage = (ev) => this.onLine(String(ev.data));
            this.send(`setoption name Hash value ${src.hash || 32}`);
            resolve();

    }
    // Fetch a file into a Blob, reporting progress the way the Stockfish script does.
    async download(url) {

      let loaded = 0;

        chunks.push(value); loaded += value.byteLength;

      });
    }
    next() {
      if (this.job || !this.queue.length) return;
      const j = this.job = this.queue.shift();
      j.lines = {};
      this.send(`setoption name UCI_LimitStrength value ${j.elo ? 'true' : 'false'}`);
      if (j.elo) this.send(`setoption name UCI_Elo value ${j.elo}`);
      this.send(`setoption name MultiPV value ${j.multipv || 1}`);
      this.send('position startpos' + (j.moves.length ? ' moves ' + j.moves.join(' ') : ''));
      this.send(`go movetime ${j.movetime}`);
    }
    onLine(line) {
      const j = this.job;
      if (!j) return;
      if (line.startsWith('info') && line.includes(' pv ') && !/ (lower|upper)bound /.test(line)) {
        const f = line.split(' ');
        const at = (k) => f[f.indexOf(k) + 1];
        const mpv = f.includes('multipv') ? +at('multipv') : 1;
        let score = 0;
        if (f.includes('mate')) { const n = +at('mate'); score = n > 0 ? MATE - (2 * n - 1) : -(MATE - 2 * -n); }
        else if (f.includes('cp')) score = +at('cp');
        j.lines[mpv] = { depth: +at('depth'), score, pv: f.slice(f.indexOf('pv') + 1) };
      } else if (line.startsWith('bestmove')) {

        const l1 = j.lines[1], l2 = j.lines[2];

        j.resolve(j.cancelled ? null : {
          move: best, best, score: l1 ? l1.score : 0, bestScore: l1 ? l1.score : 0,
          second: l2 ? l2.score : null, pv: l1 ? l1.pv : [best], depth: l1 ? l1.depth : 0,

  const builtin = new BuiltinEngine();

    () => (http ? [{ direct: 'stockfish/stockfish-19-lite-single.js' }, {}] : [{}]), 20000);

    () => (http ? [{ js: `stockfish/${FULL_SF}.js`, wasm: `stockfish/${FULL_SF}.wasm`, probe: true, hash: 128 }] : [])
      .concat([{ cache: FULL_SF + '@19.0.0', js: FULL_SF_CDN + FULL_SF + '.js', wasm: FULL_SF_CDN + FULL_SF + '.wasm', hash: 128 }]), 15 * 60000);

  const REVIEW_MS = 500; // Stockfish per position in review (built-in fallback: 900 ms)
  const DEEP_REVIEW_MS = 1500; // full Stockfish per position in deep review

    // Stockfish Lite's Elo limiter reads about 140 low, so 2540 here plays at 2400 (measured; see README).
    { elo: 2400, engine: 'stockfish', uciElo: 2540, movetime: 500, fallback: { maxDepth: 64, timeMs: 1500 } },
  ]);

  async function botMove(level, moves) {
    const g = gen;
    let r = null;
    if (level.engine === 'stockfish' && await stockfish.load()) {
      r = await stockfish.request({ moves, elo: level.uciElo, movetime: level.movetime });
    } else {
      r = await builtin.think({ fen: E.START_FEN, moves, ...(level.fallback || level) });
    }
    return g === gen && r ? r.move : null;
  }

  async function analyze(moves, urgent) {
    const g = gen;
    let r = null;
    if (review && review.deep && await deepStockfish.load()) r = await deepStockfish.request({ moves, movetime: DEEP_REVIEW_MS, multipv: 2 }, urgent);
    else if (await stockfish.load()) r = await stockfish.request({ moves, movetime: REVIEW_MS, multipv: 2 }, urgent);
    else {
      const t = await builtin.think({ fen: E.START_FEN, moves, timeMs: 900, window: 250 });
      if (t) r = { best: t.best, score: t.bestScore, second: t.lines[1] ? t.lines[1].score : null, pv: [t.best] };

  }
  const engineLabel = () => (review && review.deep ? `Stockfish 19 (full), ${DEEP_REVIEW_MS / 1000} s per position, running on your device`
    : sfOk === null ? 'Loading Stockfish…' : sfOk ? 'Stockfish 19 Lite, running on your device' : 'Built-in engine (Stockfish could not start)');

  // ---- State ----

  levelEl.value = '2';

  let review = null;

  const positions = () => history.concat([game]);
  const aiColor = () => (modeEl.value === 'ai-b' ? 'b' : modeEl.value === 'ai-w' ? 'w' : null);
  function gameStatus() {

  }
  const humanTurn = () => !review && !thinking && game.turn !== aiColor() && !gameStatus().over;

  function newGame() {
    cancelEngine();
    thinking = false;
    game = E.newGame();
    history = []; sans = []; ucis = [];
    selected = null; endShown = false; resigned = null; review = null;
    closeModal('endModal'); closeModal('promoModal');
    flipped = modeEl.value === 'ai-w';
    render();
    maybeAI();

    sans.push(E.san(game, m));
    ucis.push(uciOf(m));
    history.push(game);

    selected = null;
    render();
    maybeAI();
  }

  function maybeAI() {
    if (review || game.turn !== aiColor() || gameStatus().over) return;
    thinking = true;
    render();
    const started = Date.now();
    botMove(LEVELS[+levelEl.value], ucis.slice()).then((u) => {
      if (!u) return;
      setTimeout(() => {
        if (!thinking) return;
        thinking = false;
        const m = findUci(game, u);
        if (m) doMove(m); else render();
      }, Math.max(0, 350 - (Date.now() - started)));
    });
  }

  function undo() {
    if (!history.length || review) return;
    cancelEngine();
    thinking = false;
    resigned = null;
    do { game = history.pop(); sans.pop(); ucis.pop(); } while (history.length && game.turn === aiColor());
    selected = null; endShown = false;
    render();
    maybeAI();
  }

  let resignTimer = null;
  function resign() {
    const btn = $('resign');

    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = 'Confirm resign';

      return;
    }

    btn.classList.remove('armed'); btn.textContent = 'Resign';

  // ---- Input: tap a piece then a square, or drag. In review, moves start a variation. ----
  const boardState = () => (review ? curNode().state : game);

  const legalTo = (from, to) => E.legalMoves(boardState()).filter((m) => m.from === from && m.to === to);

  }

    if (!marks.arrows.length && !marks.squares.length) return false;

  boardEl.addEventListener('contextmenu', (e) => e.preventDefault());
  boardEl.addEventListener('dragstart', (e) => e.preventDefault());
  boardEl.addEventListener('mousedown', (e) => e.preventDefault()); // Shift+click would otherwise select page text
  boardEl.addEventListener('pointerdown', (e) => {
    const i = squareAt(e.clientX, e.clientY);

    e.preventDefault(); // no native text selection or image drag

      ann = { from: i, to: i, id: e.pointerId };
      boardEl.setPointerCapture(e.pointerId);
      return;
    }
    if (e.button !== 0) return;
    const cleared = clearMarks();
    if (!canMove()) { if (cleared) render(); return; }
    const st = boardState(), p = st.board[i];
    if (selected !== null && legalTo(selected, i).length) { play(legalTo(selected, i)); return; }
    if (p && p.c === st.turn) {
      deselectOnUp = selected === i; selected = i;
      const size = sqEl(i).getBoundingClientRect().width;
      const ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.style.width = ghost.style.height = size + 'px';
      ghost.innerHTML = pieceSVG(p.t, p.c);
      document.body.appendChild(ghost);
      drag = { from: i, id: e.pointerId, ghost, size, over: null };
      moveGhost(e.clientX, e.clientY);
      boardEl.setPointerCapture(e.pointerId);
      render();
      setDragOver(i);
    } else { selected = null; render(); }
  });
  boardEl.addEventListener('pointermove', (e) => {
    if (drag && e.pointerId === drag.id) {
      moveGhost(e.clientX, e.clientY);
      setDragOver(squareAt(e.clientX, e.clientY));
    } else if (ann && e.pointerId === ann.id) {
      const i = squareAt(e.clientX, e.clientY);
      if (i !== ann.to) { ann.to = i; drawAnnPreview(); }
    }
  });
  boardEl.addEventListener('pointerup', (e) => {
    if (ann && e.pointerId === ann.id) {
      const { from } = ann, to = squareAt(e.clientX, e.clientY);
      ann = null;
      if (to === from) {
        const k = marks.squares.indexOf(from);
        if (k >= 0) marks.squares.splice(k, 1); else marks.squares.push(from);
      } else if (to !== null) {
        const k = marks.arrows.findIndex((a) => a.from === from && a.to === to);
        if (k >= 0) marks.arrows.splice(k, 1); else marks.arrows.push({ from, to });
      }
      render();
      return;
    }
    if (!drag || e.pointerId !== drag.id) return;
    const from = drag.from, i = squareAt(e.clientX, e.clientY);
    endDrag();
    if (i === from) { if (deselectOnUp) selected = null; render(); }
    else if (i !== null && canMove() && legalTo(from, i).length) play(legalTo(from, i));
    else render(); // dropped off the board or on an illegal square: snap back, keep the piece selected
  });
  boardEl.addEventListener('pointercancel', () => { ann = null; endDrag(); render(); });

  function openPromo(options) {
    pendingPromo = options;
    const box = $('promoChoices');
    box.innerHTML = '';
    for (const t of ['q', 'r', 'b', 'n']) {
      const b = document.createElement('button');
      b.title = pieceName(t);
      b.innerHTML = pieceSVG(t, boardState().turn);
      b.onclick = () => { closeModal('promoModal'); const m = pendingPromo.find((o) => o.promo === t); pendingPromo = null; commit(m); };
      box.appendChild(b);
    }
    $('promoModal').classList.add('open');
  }
  function closeModal(id) { $(id).classList.remove('open'); }

  // ---- Review ----
  const RS = window.ReviewStats, winPct = RS.winPct;
  function fmtEval(cp) { // cp from White's view
    if (Math.abs(cp) >= AI.MATE_BOUND) { const n = Math.ceil((MATE - Math.abs(cp)) / 2); return (cp > 0 ? '' : '-') + 'M' + n; }
    return (cp > 0 ? '+' : '') + (cp / 100).toFixed(1);
  }
  function uciOf(m) { return E.squareName(m.from) + E.squareName(m.to) + (m.promo || ''); }
  function findUci(s, u) { return E.legalMoves(s).find((m) => uciOf(m) === u); }
  const moveNo = (ply) => `${Math.floor(ply / 2) + 1}${ply % 2 ? '…' : '.'} `;

  // A move "sacrifices" material if the moved piece can be won by the opponent for less than it is worth.
  function isSacrifice(before, next) {
    const m = next.lastMove;
    const V = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 };
    const piece = next.board[m.to];
    if (!piece || piece.t === 'p' || piece.t === 'k') return false;
    const gained = m.enPassant ? 1 : before.board[m.to] ? V[before.board[m.to].t] : 0;
    const caps = E.legalMoves(next).filter((x) => x.to === m.to);
    if (!caps.length) return false;
    const cheapest = caps.reduce((a, x) => (V[next.board[x.from].t] < V[next.board[a.from].t] ? x : a));
    const minA = V[next.board[cheapest.from].t];
    const defended = E.legalMoves(E.makeMove(next, cheapest)).some((x) => x.to === m.to);
    return (defended ? V[piece.t] - minA : V[piece.t]) - gained >= 2;
  }

  // Classify the move from `before` to `next`, given engine analysis of both positions (side-to-move view).
  function classifyMove(before, next, a, b, uci, movesSoFar) {
    const wpBefore = winPct(a.score), wpAfter = winPct(-b.score);
    const loss = Math.max(0, wpBefore - wpAfter);
    let c;
    if (isBook(movesSoFar, movesSoFar.length - 1)) c = 'book';
    else if (uci === a.best || loss < 0.5) {
      c = 'best';
      if (uci === a.best && wpBefore < 97 && wpAfter >= 45 && isSacrifice(before, next)) c = 'brilliant';
      else if (uci === a.best && a.second !== null && wpBefore - winPct(a.second) >= 18 && wpAfter >= 30 && wpBefore < 95) c = 'great';
    } else if (loss <= 2) c = 'excellent';
    else if (loss <= 5) c = 'good';
    else if (loss <= 10) c = 'inaccuracy';
    else if (loss <= 20) c = 'mistake';
    else c = 'blunder';
    const cpLoss = Math.max(0, RS.cpClamp(a.score) - RS.cpClamp(-b.score));
    return { c, loss, cpLoss, acc: c === 'book' ? 100 : RS.moveAccuracy(loss), counted: c !== 'book' };
  }

  async function analysisFor(state, moves, urgent) {
    const st = E.status(state);
    if (st.over && st.result === 'checkmate') return { score: -MATE, best: null, second: null, pv: [] };
    if (st.over) return { score: 0, best: null, second: null, pv: [] };
    return analyze(moves, urgent);
  }

  // Deep review re-analyzes the game with the full Stockfish 19, downloading it first if needed.
  let deepError = '';
  async function startReview(deep) {
    if (!history.length) return;
    deep = deep === true;
    cancelEngine();
    thinking = false; selected = null;
    closeModal('endModal');
    const pos = positions();
    const cur = review ? review.cur : { line: -1, k: pos.length - 1 };
    review = { cur: { line: -1, k: cur.line < 0 ? cur.k : pos.length - 1 }, analysis: new Array(pos.length), cls: [], done: 0, lines: [], deep, loading: deep };
    const myReview = review;
    deepError = '';
    render();
    if (deep) {
      const ok = await deepStockfish.load();
      if (review !== myReview) return;
      review.loading = false;
      if (ok) deepCached = true;
      else {
        deepError = 'Deep review needs an internet connection the first time, to download the full engine (about 99 MB). After that it works offline. Showing the normal review instead.';
        review.deep = false;
      }
      render();
    }
    for (let i = 0; i < pos.length; i++) {
      if (review !== myReview) return;
      if (!review.analysis[i]) {
        const a = await analysisFor(pos[i], ucis.slice(0, i), false);
        if (!a || review !== myReview) return;
        if (!review.analysis[i]) review.analysis[i] = a;
      }
      review.done = i + 1;
      if (i > 0) review.cls[i - 1] = classifyMove(pos[i - 1], pos[i], review.analysis[i - 1], review.analysis[i], ucis[i - 1], ucis.slice(0, i));
      render();
    }
  }
  function exitReview() { cancelEngine(); review = null; selected = null; render(); maybeAI(); }

  // The position being viewed in review: on the main line, or k moves into variation `line`.
  function curNode() {
    const c = review.cur, pos = positions();
    if (c.line < 0) {
      const k = c.k;
      return {
        state: pos[k], analysis: review.analysis[k], moves: ucis.slice(0, k), path: pos.slice(0, k + 1),
        move: k > 0 ? { san: sans[k - 1], cls: review.cls[k - 1], prevState: pos[k - 1], prevAnalysis: review.analysis[k - 1], uci: ucis[k - 1], ply: k - 1 } : null,
      };
    }
    const L = review.lines[c.line], k = c.k;
    return {
      state: L.states[k - 1], analysis: L.analysis[k - 1], moves: ucis.slice(0, L.start).concat(L.moves.slice(0, k)),
      path: pos.slice(0, L.start + 1).concat(L.states.slice(0, k)),
      move: {
        san: L.sans[k - 1], cls: L.cls[k - 1], prevState: k > 1 ? L.states[k - 2] : pos[L.start],
        prevAnalysis: k > 1 ? L.analysis[k - 2] : review.analysis[L.start], uci: L.moves[k - 1], ply: L.start + k - 1,
      },
    };
  }

  // A move played on the board during review follows the game, an existing variation, or starts a new one.
  function reviewMove(m) {
    const c = review.cur, node = curNode(), u = uciOf(m);
    const next = E.makeMove(node.state, m), san = E.san(node.state, m);
    selected = null;
    if (c.line < 0) {
      if (c.k < ucis.length && ucis[c.k] === u) { review.cur = { line: -1, k: c.k + 1 }; render(); return; }
      let li = review.lines.findIndex((l) => l.start === c.k && l.moves[0] === u);
      if (li < 0) { review.lines.push({ start: c.k, moves: [u], sans: [san], states: [next], analysis: [], cls: [] }); li = review.lines.length - 1; }
      review.cur = { line: li, k: 1 };
    } else {
      const L = review.lines[c.line];
      if (c.k < L.moves.length && L.moves[c.k] === u) { review.cur = { line: c.line, k: c.k + 1 }; render(); return; }
      for (const arr of [L.moves, L.sans, L.states, L.analysis, L.cls]) arr.length = Math.min(arr.length, c.k);
      L.moves.push(u); L.sans.push(san); L.states.push(next);
      review.cur = { line: c.line, k: c.k + 1 };
    }
    render();
    analyzeVariation(review.lines[review.cur.line], review.cur.k);
  }

  async function analyzeVariation(L, k) {
    const myReview = review, state = L.states[k - 1];
    const moves = ucis.slice(0, L.start).concat(L.moves.slice(0, k));
    const prevState = k > 1 ? L.states[k - 2] : positions()[L.start];
    let prev = k > 1 ? L.analysis[k - 2] : review.analysis[L.start];
    if (!prev) {
      prev = await analysisFor(prevState, moves.slice(0, -1), true);
      if (!prev || review !== myReview) return;
      if (k > 1) { if (L.states[k - 2] === prevState) L.analysis[k - 2] = prev; } else if (!review.analysis[L.start]) review.analysis[L.start] = prev;
    }
    const a = L.analysis[k - 1] && L.states[k - 1] === state ? L.analysis[k - 1] : await analysisFor(state, moves, true);
    if (!a || review !== myReview || L.states[k - 1] !== state) return;
    L.analysis[k - 1] = a;
    L.cls[k - 1] = classifyMove(prevState, state, prev, a, L.moves[k - 1], moves);
    render();
  }

  function goto(line, k) {
    if (!review) return;
    if (line < 0) k = Math.max(0, Math.min(positions().length - 1, k));
    else k = Math.max(1, Math.min(review.lines[line].moves.length, k));
    review.cur = { line, k }; selected = null; render();
  }
  function step(d) {
    const c = review.cur;
    if (c.line < 0) return goto(-1, c.k + d);
    if (c.k + d < 1) return goto(-1, review.lines[c.line].start);
    goto(c.line, c.k + d);
  }
  function deleteLine(li) {
    const L = review.lines[li];
    review.lines.splice(li, 1);
    if (review.cur.line === li) review.cur = { line: -1, k: L.start };
    else if (review.cur.line > li) review.cur.line--;
    render();
  }

  function pvSan(state, pv, max = 10) {
    const out = [];
    let s = state;
    for (const u of (pv || []).slice(0, max)) {
      const m = findUci(s, u);
      if (!m) break;
      const ply = (s.fullmove - 1) * 2 + (s.turn === 'b' ? 1 : 0);
      out.push((s.turn === 'w' || !out.length ? moveNo(ply) : '') + E.san(s, m));
      s = E.makeMove(s, m);
    }
    return out.join(' ');
  }

  function renderReview() {
    const pos = positions(), n = pos.length, node = curNode();
    $('reviewProgress').style.width = (100 * review.done / n) + '%';
    const p = deepStockfish.progress;
    $('reviewProgressText').textContent = review.loading
      ? (p && p.total ? `Downloading full Stockfish… ${Math.floor(100 * p.percent)}% of ${Math.round(p.total / 1e6)} MB${p.etaText ? ', ' + p.etaText + ' left' : ''}`
        : p ? `Downloading full Stockfish… ${Math.round(p.loaded / 1e6)} MB`
        : 'Starting full Stockfish…')
      : (deepError ? deepError + ' ' : '') + (review.done < n
        ? `Analyzing… ${review.done}/${n} positions`
        : `Analyzed ${n - 1} moves. Play moves on the board to explore variations.`);
    $('deepReview').disabled = review.deep;
    $('deepReview').textContent = review.deep || deepCached ? 'Deep review' : 'Deep review (≈99 MB download)';
    $('engineLabel').textContent = 'Engine: ' + engineLabel();
    // Accuracy and estimated rating over the game's main line (book moves don't count)
    let lastWin = 50;
    const whiteWin = pos.map((st, k) => {
      const an = review.analysis[k];
      if (an) lastWin = winPct(st.turn === 'w' ? an.score : -an.score);
      return lastWin;
    });
    const moves = pos.slice(1).map((_, k) => review.cls[k] || null);
    const cpLoss = moves.map((m) => (m && m.counted ? m.cpLoss : null));
    for (const c of ['w', 'b']) {
      const acc = RS.gameAccuracy(whiteWin, moves, c);
      const counted = moves.filter((m, k) => m && m.counted && (k % 2 === 0) === (c === 'w')).length;
      const elo = RS.estimateElo(RS.acpl(cpLoss, c), counted);
      $(c === 'w' ? 'accW' : 'accB').textContent = acc === null ? '–' : acc.toFixed(1);
      $(c === 'w' ? 'eloW' : 'eloB').textContent = elo === null ? '–' : '≈' + elo;
      $(c === 'w' ? 'eloW' : 'eloB').title = elo === null
        ? `Needs at least ${RS.MIN_MOVES_FOR_ELO} non-book moves`
        : `Average centipawn loss ${RS.acpl(cpLoss, c).toFixed(0)} over ${counted} moves`;
    }
    // Comment on the move that led to the viewed position, plus the engine's line from here
    const cm = $('comment'), a = node.analysis, mv = node.move;
    const ev = a ? (node.state.turn === 'w' ? a.score : -a.score) : null;
    const evalTxt = ev !== null ? 'Evaluation ' + fmtEval(ev) : 'Analyzing…';
    const line = a && a.pv && a.pv.length ? `<div class="ev">Best line: ${pvSan(node.state, a.pv)}</div>` : '';
    const varTag = review.cur.line >= 0 ? '<span class="tag">Variation</span> ' : '';
    if (!mv) cm.innerHTML = `<div><b>Starting position</b><div class="ev">${evalTxt}</div>${line}</div>`;
    else if (!mv.cls) cm.innerHTML = `<div>${varTag}<b>${moveNo(mv.ply)}${mv.san}</b><div class="ev">Analyzing…</div></div>`;
    else {
      const k = mv.cls.c;
      const phrases = { brilliant: 'is brilliant!', great: 'is a great move. It was the only move that holds.', best: 'is the best move.',
        excellent: 'is excellent.', good: 'is a good move.', book: 'is a book move.', inaccuracy: 'is an inaccuracy.',
        mistake: 'is a mistake.', blunder: 'is a blunder.' };
      let bestTxt = '';
      if (mv.prevAnalysis && mv.prevAnalysis.best && mv.prevAnalysis.best !== mv.uci && !['book', 'best'].includes(k)) {
        const bm = findUci(mv.prevState, mv.prevAnalysis.best);
        if (bm) bestTxt = ` The best move was <b>${E.san(mv.prevState, bm)}</b>.`;
      }
      cm.innerHTML = `${clsIcon(k)}<div>${varTag}<b>${moveNo(mv.ply)}${mv.san}</b> ${phrases[k]}${bestTxt}<div class="ev">${evalTxt}</div>${line}</div>`;
    }
    // Eval bar (White's share fills from White's side of the board)
    $('evalbar').classList.toggle('flipped', flipped);
    if (ev !== null) {
      $('evalfill').style.height = Math.max(3, Math.min(97, winPct(ev))) + '%';
      const num = $('evalnum');
      num.textContent = fmtEval(ev).replace('+', '');
      num.className = 'num ' + ((ev >= 0) !== flipped ? 'bottom' : 'top');
    }
    // Evaluation graph (main line)
    const g = $('graph'), W = 300, H = 64, pts = [];
    for (let k = 0; k < n; k++) {
      const an = review.analysis[k];
      if (!an) break;
      const cp = pos[k].turn === 'w' ? an.score : -an.score;
      pts.push([n > 1 ? (k / (n - 1)) * W : 0, H - (winPct(cp) / 100) * H]);
    }
    let svg = `<rect width="${W}" height="${H}" fill="#403d39"/>`;
    if (pts.length) svg += `<path d="M0 ${H} ${pts.map((p) => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')} L${pts[pts.length - 1][0].toFixed(1)} ${H} Z" fill="#f2f2f2"/>`;
    svg += `<line x1="0" x2="${W}" y1="${H / 2}" y2="${H / 2}" stroke="#888" stroke-width=".6" stroke-dasharray="3 3"/>`;
    review.cls.forEach((x, k) => {
      if (x && ['blunder', 'mistake', 'brilliant', 'great'].includes(x.c) && pts[k + 1]) {
        svg += `<circle cx="${pts[k + 1][0]}" cy="${pts[k + 1][1]}" r="3" fill="${CLS[x.c].color}" stroke="#222" stroke-width=".6"/>`;
      }
    });
    const mainIdx = review.cur.line < 0 ? review.cur.k : review.lines[review.cur.line].start;
    const cx = n > 1 ? (mainIdx / (n - 1)) * W : 0;
    svg += `<line x1="${cx}" x2="${cx}" y1="0" y2="${H}" stroke="#81b64c" stroke-width="2"/>`;
    g.innerHTML = svg;
    // Classification counts (main line)
    let html = '<span></span><span class="h">White</span><span class="h">Black</span>';
    for (const k of CLS_ORDER) {
      const cw = review.cls.filter((x, j) => x && x.c === k && j % 2 === 0).length;
      const cb = review.cls.filter((x, j) => x && x.c === k && j % 2 === 1).length;
      html += `<span class="lbl">${clsIcon(k)}${CLS[k].label}</span><span class="v" style="color:${cw ? CLS[k].color : 'var(--muted)'}">${cw}</span><span class="v" style="color:${cb ? CLS[k].color : 'var(--muted)'}">${cb}</span>`;
    }
    $('counts').innerHTML = html;
    const atStart = review.cur.line < 0 && review.cur.k === 0;
    const atEnd = review.cur.line < 0 ? review.cur.k === n - 1 : review.cur.k === review.lines[review.cur.line].moves.length;
    $('navFirst').disabled = $('navPrev').disabled = atStart;
    $('navNext').disabled = atEnd;
    $('navLast').disabled = review.cur.line < 0 && review.cur.k === n - 1;
  }

  // ---- Rendering ----
  function render() {
    $('app').classList.toggle('review-on', !!review);
    const pos = positions();
    const node = review ? curNode() : null;
    const view = review ? node.state : game;
    const legal = selected !== null && canMove() ? E.legalMoves(view).filter((m) => m.from === selected) : [];
    const last = view.lastMove;
    const kingInCheck = E.inCheck(view) ? view.board.findIndex((p) => p && p.t === 'k' && p.c === view.turn) : -1;
    const badge = node && node.move && node.move.cls ? node.move.cls.c : null;
    if (marks.view !== view) { marks.view = view; marks.arrows = []; marks.squares = []; }

    boardEl.innerHTML = '';
    for (let v = 0; v < 64; v++) {
      const i = flipped ? 63 - v : v;
      const r = Math.floor(i / 8), c = i % 8;
      const d = document.createElement('div');
      d.className = 'sq ' + ((r + c) % 2 ? 'dark' : 'light');
      d.dataset.i = i;
      d.style.backgroundPosition = `${-((i * 97) % 170)}px ${-((i * 61) % 170)}px`;
      if (last && (last.from === i || last.to === i)) d.classList.add('last');
      if (selected === i) d.classList.add('sel');
      if (marks.squares.includes(i)) d.classList.add('marked');
      if (drag && drag.from === i) d.classList.add('drag-src');
      if (drag && drag.over === i && i !== drag.from) d.classList.add('drag-over');
      if (kingInCheck === i) d.classList.add('check');
      const target = legal.find((m) => m.to === i);
      if (target) d.classList.add('target', view.board[i] || target.enPassant ? 'capture' : 'quiet');
      const p = view.board[i];
      if (p) {
        d.innerHTML = pieceSVG(p.t, p.c);
        d.setAttribute('aria-label', `${NAMES[p.c]} ${pieceName(p.t)} on ${E.squareName(i)}`);
      }
      if (badge && last && last.to === i) d.insertAdjacentHTML('beforeend', clsIcon(badge, 'badge'));
      if (v % 8 === 0) d.insertAdjacentHTML('beforeend', `<span class="coord rank">${8 - r}</span>`);
      if (v >= 56) d.insertAdjacentHTML('beforeend', `<span class="coord file">${'abcdefgh'[c]}</span>`);
      boardEl.appendChild(d);
    }
    // In review, show the engine's best move as an arrow when the played move wasn't best
    if (node && node.move && node.move.cls && !['best', 'book', 'brilliant', 'great'].includes(node.move.cls.c)) {
      const best = node.move.prevAnalysis && node.move.prevAnalysis.best;
      const bm = best && findUci(node.move.prevState, best);
      if (bm) boardEl.insertAdjacentHTML('beforeend', arrowSVG(bm.from, bm.to));
    }
    for (const a of marks.arrows) boardEl.insertAdjacentHTML('beforeend', arrowSVG(a.from, a.to, USER_ARROW));
    drawAnnPreview();

    // Status line
    const gs = gameStatus();
    let msg;
    if (review) msg = review.cur.line >= 0 ? 'Game review: exploring a variation' : 'Game review';
    else if (gs.over) {
      if (gs.result === 'checkmate') msg = `Checkmate! ${NAMES[gs.winner]} wins`;
      else if (gs.result === 'resign') msg = `${NAMES[other(gs.winner)]} resigned. ${NAMES[gs.winner]} wins`;
      else msg = `Draw by ${drawReason(gs.result)}`;
    } else if (thinking) msg = `Computer (${LEVELS[+levelEl.value].elo}) is thinking…`;
    else msg = `${NAMES[game.turn]} to move${gs.check ? ', check!' : ''}`;
    const sw = review ? view.turn : gs.over && gs.winner ? gs.winner : game.turn;
    statusEl.innerHTML = `<span class="swatch ${sw}"></span>${msg}`;

    // Captured pieces (along the viewed line)
    const caps = { w: [], b: [] };
    const path = node ? node.path : pos;
    for (let k = 1; k < path.length; k++) if (path[k].captured) caps[path[k - 1].turn].push(path[k].captured);
    const order = 'qrbnp';
    // Material lead from the pieces on the board, so promotions count too
    const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
    const lead = view.board.reduce((s, p) => s + (p ? (p.c === 'w' ? 1 : -1) * VAL[p.t] : 0), 0);
    for (const c of ['w', 'b']) {
      caps[c].sort((a, b) => order.indexOf(a.t) - order.indexOf(b.t));
      const ahead = c === 'w' ? lead : -lead;
      $(c === 'w' ? 'capW' : 'capB').innerHTML = caps[c].map((p) => pieceSVG(p.t, p.c, '')).join('') +
        (ahead > 0 ? `<span class="lead">+${ahead}</span>` : '');
    }

    // Move list, with review variations under the move they branch from
    const mvEl = $('moves');
    const cur = review ? (review.cur.line < 0 ? review.cur.k - 1 : -2) : sans.length - 1;
    const cell = (k) => {
      if (k >= sans.length) return '<span></span>';
      const icon = review && review.cls[k] ? clsIcon(review.cls[k].c) : '';
      return `<span><span class="mv${k === cur ? ' cur' : ''}" data-k="${k}">${icon}${sans[k]}</span></span>`;
    };
    const varRow = (L, li) => {
      let h = '';
      L.sans.forEach((s, j) => {
        const ply = L.start + j;
        const num = ply % 2 === 0 || j === 0 ? `<span class="vn">${moveNo(ply)}</span>` : '';
        const icon = L.cls[j] ? clsIcon(L.cls[j].c) : '';
        const isCur = review.cur.line === li && review.cur.k === j + 1;
        h += `${num}<span class="mv${isCur ? ' cur' : ''}" data-line="${li}" data-k="${j + 1}">${icon}${s}</span> `;
      });
      return `<div class="var">${h}<button class="vdel" data-del="${li}" title="Delete variation">×</button></div>`;
    };
    let html = '';
    for (let k = 0; k < sans.length; k += 2) {
      html += `<span class="n">${k / 2 + 1}.</span>${cell(k)}${cell(k + 1)}`;
      if (review) review.lines.forEach((L, li) => { if (L.start === k || L.start === k + 1) html += varRow(L, li); });
    }
    if (review) review.lines.forEach((L, li) => { if (L.start >= sans.length + (sans.length % 2)) html += varRow(L, li); });
    mvEl.innerHTML = html;
    const curEl = mvEl.querySelector('.mv.cur');
    if (curEl) mvEl.scrollTop = curEl.offsetTop - mvEl.offsetTop - mvEl.clientHeight / 2;

    $('undo').disabled = !history.length || !!review;
    $('reviewBtn').disabled = !history.length || !!review;
    $('resign').disabled = !!review || gs.over;
    levelEl.disabled = !aiColor();
    if (review) renderReview();

    if (!review && gs.over && !endShown) {
      endShown = true;
      setTimeout(() => showEnd(gs), 400);
    }
  }

  function arrowSVG(from, to, color = 'rgba(129,182,76,.85)', cls = '') {
    const xy = (i) => { const v = flipped ? 63 - i : i; return [(v % 8) + 0.5, Math.floor(v / 8) + 0.5]; };
    const [x1, y1] = xy(from), [x2, y2] = xy(to);
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const hx = x2 - ux * 0.38, hy = y2 - uy * 0.38, w = 0.11, hw = 0.26;
    const pts = [
      [x1 + uy * w, y1 - ux * w], [hx + uy * w, hy - ux * w], [hx + uy * hw, hy - ux * hw], [x2, y2],
      [hx - uy * hw, hy + ux * hw], [hx - uy * w, hy + ux * w], [x1 - uy * w, y1 + ux * w],
    ].map((p) => p.map((n) => n.toFixed(3)).join(',')).join(' ');
    return `<svg class="arrows ${cls}" viewBox="0 0 8 8" preserveAspectRatio="none"><polygon points="${pts}" fill="${color}"/></svg>`;
  }

  function drawReason(r) {
    return { stalemate: 'stalemate', fifty: 'the 50-move rule', repetition: 'threefold repetition', material: 'insufficient material' }[r];
  }
  function showEnd(st) {
    $('endEmoji').textContent = st.winner ? (st.winner === 'w' ? '🤍🏆' : '🖤🏆') : '🤝';
    $('endTitle').textContent = st.winner ? `${NAMES[st.winner]} wins!` : 'Draw';
    $('endText').textContent = st.result === 'checkmate' ? 'By checkmate.' : st.result === 'resign' ? 'By resignation.' : `By ${drawReason(st.result)}.`;
    $('endModal').classList.add('open');
  }

  $('newGame').onclick = newGame;
  $('endNew').onclick = newGame;
  $('endClose').onclick = () => closeModal('endModal');
  $('endReview').onclick = startReview;
  $('reviewBtn').onclick = startReview;
  $('exitReview').onclick = exitReview;
  $('deepReview').onclick = () => startReview(true);
  $('undo').onclick = undo;
  $('resign').onclick = resign;
  $('flip').onclick = () => { flipped = !flipped; render(); };
  $('pieceSet').onchange = (e) => { pieceSet = e.target.value; render(); };
  modeEl.onchange = newGame;
  levelEl.onchange = () => { if (!history.length) newGame(); };
  $('navFirst').onclick = () => goto(-1, 0);
  $('navPrev').onclick = () => step(-1);
  $('navNext').onclick = () => step(1);
  $('navLast').onclick = () => goto(-1, positions().length - 1);
  $('moves').addEventListener('click', (e) => {
    if (!review) return;
    const del = e.target.closest('.vdel');
    if (del) return deleteLine(+del.dataset.del);
    const el = e.target.closest('.mv');
    if (!el) return;
    if (el.dataset.line !== undefined) goto(+el.dataset.line, +el.dataset.k);
    else goto(-1, +el.dataset.k + 1);
  });
  $('graph').addEventListener('click', (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    goto(-1, Math.round(((e.clientX - r.left) / r.width) * (positions().length - 1)));
  });
  document.addEventListener('keydown', (e) => {
    if (!review || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
    if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
  });

  newGame();
})();
</script>
</body>
</html>
